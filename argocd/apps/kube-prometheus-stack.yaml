apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.1.1
    helm:
      values: |
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorNamespaceSelector: {}
            ruleNamespaceSelector: {}
        alertmanager:
          alertmanagerSpec:
            secrets:
              - alertmanager-smtp
          config:
            global:
              resolve_timeout: 5m
              smtp_smarthost: smtp.gmail.com:587
              smtp_from: groupshytpm3@gmail.com
              smtp_auth_username: groupshytpm3@gmail.com
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/smtp-password
              smtp_require_tls: true
            route:
              receiver: personal-email
              group_by:
                - alertname
                - namespace
              group_wait: 10s
              group_interval: 1m
              repeat_interval: 30m
            receivers:
              - name: "null"
              - name: personal-email
                email_configs:
                  - to: groupshytpm3@gmail.com
                    send_resolved: true
        grafana:
          adminPassword: admin123
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
